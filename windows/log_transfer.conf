[INPUT]
    Name         winlog
    Channels     System
    Interval_Sec 1
    Tag          windows.system
    Db           ${FLB_DB_PATH}
    Use_ANSI     false
    # 指定该输入源使用磁盘缓冲机制
    storage.type  filesystem

[INPUT]
    Name         winlog
    Channels     Security
    Interval_Sec 1
    Tag          windows.security
    Db           ${FLB_SECURITY_DB_PATH}
    storage.type filesystem

[INPUT]
    Name         winlog
    Channels     Application
    Interval_Sec 1
    Tag          windows.application
    Db           ${FLB_APPLICATION_DB_PATH}
    Use_ANSI     false
    storage.type filesystem

[INPUT]
    Name         winlog
    Channels     Microsoft-Windows-PowerShell/Operational
    Interval_Sec 1
    Tag          windows.powershell
    Db           ${FLB_POWERSHELL_DB_PATH}
    storage.type filesystem

# 如果目标机器没有安装或启用 Sysmon，启动前请使用 2008 profile，
# 或先确认该通道存在；现代 profile 会订阅该通道的全部事件。
[INPUT]
    Name         winlog
    Channels     Microsoft-Windows-Sysmon/Operational
    Interval_Sec 1
    Tag          windows.sysmon
    Db           ${FLB_SYSMON_DB_PATH}
    storage.type filesystem

[FILTER]
    Name          modify
    Match         windows.*
    # 动态获取当前 Windows 的计算机名作为客户端唯一 ID 传给后端
    Add           client_id  ${HOSTNAME}

[FILTER]
    Name          modify
    Match         windows.system
    Add           log_source system

[FILTER]
    Name          modify
    Match         windows.security
    Add           log_source security

[FILTER]
    Name          modify
    Match         windows.application
    Add           log_source application

[FILTER]
    Name          modify
    Match         windows.powershell
    Add           log_source powershell

[FILTER]
    Name          modify
    Match         windows.sysmon
    Add           log_source sysmon

[OUTPUT]
    Name          http
    Match         windows.*
    Host          ${SERVER_HOST}
    Port          ${SERVER_PORT}
    URI           /api/v1/logs/windows
    Format        json        
    Retry_Limit   False	
    net.keepalive Off

[OUTPUT]
    Name          file
    Match         windows.*
    Path          ${LOCAL_LOG_PATH}
    File          ${LOCAL_LOG_FILE}
    Format        plain
