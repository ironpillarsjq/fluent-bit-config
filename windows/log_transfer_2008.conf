[INPUT]
    Name          winlog
    Channels      System
    Interval_Sec  1
    Tag           windows.system
    DB            ${FLB_DB_PATH}
    Use_ANSI      false
    storage.type  filesystem

[INPUT]
    Name          winlog
    Channels      Security
    Interval_Sec  1
    Tag           windows.security
    DB            ${FLB_SECURITY_DB_PATH}
    Use_ANSI      false
    storage.type  filesystem

[INPUT]
    Name          winlog
    Channels      Application
    Interval_Sec  1
    Tag           windows.application
    DB            ${FLB_APPLICATION_DB_PATH}
    Use_ANSI      false
    storage.type  filesystem

[FILTER]
    Name          modify
    Match         windows.*
    Add           client_id ${HOSTNAME}

[FILTER]
    Name          modify
    Match         windows.system
    Add           log_source system

[FILTER]
    Name          modify
    Match         windows.security
    Add           log_source security

[FILTER]
    Name          modify
    Match         windows.application
    Add           log_source application

[OUTPUT]
    Name          http
    Match         windows.*
    Host          ${SERVER_HOST}
    Port          ${SERVER_PORT}
    URI           /api/v1/logs/windows
    Format        json
    Retry_Limit   False
    net.keepalive Off

[OUTPUT]
    Name          file
    Match         windows.*
    Path          ${LOCAL_LOG_PATH}
    File          ${LOCAL_LOG_FILE}
    Format        plain
